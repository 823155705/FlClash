name: Build custom installers

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: custom-installers-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_TRAFFIC_CUSTOM_BUILD: 'true'
  APP_UPDATE_REPOSITORY: ${{ github.repository }}
  RUSTUP_TOOLCHAIN: '1.99.0'

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            platform: macos
            os: macos-latest
          - name: macos-amd64
            platform: macos
            os: macos-15-intel
          - name: windows-amd64
            platform: windows
            os: windows-2022
          - name: android
            platform: android
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Verify release tag
        shell: bash
        run: |
          version=$(awk '$1 == "version:" { print $2; exit }' pubspec.yaml)
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            printf 'Tag %s must match pubspec.yaml version v%s.\n' "$GITHUB_REF_NAME" "$version" >&2
            exit 1
          fi
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          cache: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: core/go.sum
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
          targets: ${{ matrix.platform == 'android' && 'aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            plugins/rust_api/rust
            services/helper
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        if: matrix.platform == 'android'
      - uses: nttld/setup-ndk@v1
        if: matrix.platform == 'android'
        id: ndk
        with:
          ndk-version: r28c
          add-to-path: true
          link-to-sdk: true
      - name: Prepare Android APKs for local release signing
        if: matrix.platform == 'android'
        run: |
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          keytool -genkeypair -noprompt -keystore android/app/keystore.jks \
            -storetype JKS -storepass "$password" -keypass "$password" \
            -alias transport -keyalg RSA -keysize 2048 -validity 7 -dname 'CN=CI transport only'
          printf '\nkeyAlias=transport\nstorePassword=%s\nkeyPassword=%s\n' \
            "$password" "$password" >> android/local.properties
      - name: Prepare Windows packaging
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          git config --global core.longpaths true
          if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup --yes --no-progress
          }
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files (x86)\Inno Setup 6'
          Add-Content -Path $env:GITHUB_PATH -Value "$env:LOCALAPPDATA\Pub\Cache\bin"
      - uses: actions/setup-node@v4
        if: matrix.platform == 'macos'
        with:
          node-version: 22
      - name: Use the supported Xcode
        if: matrix.platform == 'macos'
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app || sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version
      - name: Disable Impeller on Intel macOS
        if: matrix.name == 'macos-amd64'
        run: plutil -replace FLTEnableImpeller -bool NO macos/Runner/Info.plist
      - name: Fetch CA certificates
        shell: bash
        env:
          CA_BUNDLE: cacert-2026-09-25.pem
          CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -
      - name: Package and check the installer
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          PLATFORM: ${{ matrix.platform }}
          FLUTTER_MACOS_ARM64_ONLY: ${{ matrix.name == 'macos-arm64' }}
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          flutter pub get
          dart tool/package.dart "$PLATFORM" --env stable --tag "$GITHUB_REF_NAME"
          if [[ "$PLATFORM" == macos ]]; then
            hdiutil verify dist/*.dmg
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.name }}
          path: dist/
          if-no-files-found: error
