name: tray_panel
description: Native tray popover panel for FlClash on macOS and Windows.
version: 0.0.1

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.50.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      macos:
        pluginClass: TrayPanelPlugin
      windows:
        pluginClass: TrayPanelPluginCApi
