<style>
  /* Design tokens — HyperOS system-card, minimalism + Swiss grid */
  :root {
    --bg: #f0f0f3;
    --bg-glow: rgba(255, 255, 255, 0.65);
    --surface: #ffffff;
    --surface-2: #f7f7f9;
    --surface-press: rgba(0, 0, 0, 0.05);
    --text: #111114;
    --text-2: rgba(17, 17, 20, 0.56);
    --text-3: rgba(17, 17, 20, 0.38);
    --divider: rgba(17, 17, 20, 0.08);
    --accent: #22c55e;
    --accent-soft: rgba(34, 197, 94, 0.14);
    --off: #a1a1a6;
    --off-soft: rgba(140, 140, 148, 0.16);
    --tint: #0a84ff;
    --chart-up: #6366f1;
    --chart-down: #22c55e;
    --danger: #ff453a;
    --radius-card: 24px;
    --radius-row: 14px;
    --radius-pill: 999px;
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 20px;
    --space-6: 28px;
    --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.04), 0 8px 24px rgba(0, 0, 0, 0.06);
    --shadow-float: 0 2px 8px rgba(0, 0, 0, 0.08);
    --tap: 48px;
    --dur: 180ms;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --font: "Inter", -apple-system, "SF Pro Text", "PingFang SC", "MiSans",
      "HarmonyOS Sans SC", "Noto Sans SC", sans-serif;
  }

  [data-theme="dark"] {
    --bg: #0b0b0d;
    --bg-glow: rgba(255, 255, 255, 0.04);
    --surface: #1c1c1e;
    --surface-2: #2c2c2e;
    --surface-press: rgba(255, 255, 255, 0.08);
    --text: #f5f5f7;
    --text-2: rgba(245, 245, 247, 0.62);
    --text-3: rgba(245, 245, 247, 0.38);
    --divider: rgba(255, 255, 255, 0.10);
    --accent: #30d158;
    --accent-soft: rgba(48, 209, 88, 0.18);

    --off-soft: rgba(142, 142, 147, 0.18);
    --tint: #0a84ff;
    --chart-up: #818cf8;
    --chart-down: #30d158;
    --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.25), 0 12px 32px rgba(0, 0, 0, 0.35);
    --shadow-float: 0 2px 10px rgba(0, 0, 0, 0.35);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html {
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }
  body {
    margin: 0;
    min-height: 100dvh;
    background:
      radial-gradient(1200px 600px at 50% -10%, var(--bg-glow), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.45;
    letter-spacing: -0.01em;
    -webkit-font-smoothing: antialiased;
    padding:
      max(16px, env(safe-area-inset-top))
      max(16px, env(safe-area-inset-right))
      max(28px, env(safe-area-inset-bottom))
      max(16px, env(safe-area-inset-left));
  }

  .app {
    width: min(100%, 420px);
    margin: 0 auto;
  }

  /* Header */
  .top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: var(--space-3);
    margin-bottom: var(--space-5);
  }
  .brand h1 {
    margin: 0;
    font-size: 24px;

    letter-spacing: -0.03em;
    line-height: 1.15;
  }
  .brand .sub {
    margin: 4px 0 0;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-2);
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 28px;
    padding: 0 10px;
    border-radius: var(--radius-pill);
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 11px;
    font-weight: 650;
    letter-spacing: 0.01em;

  }
  .badge i {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
  }

  /* Toolbar */
  .toolbar {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    margin-bottom: var(--space-5);
    flex-wrap: wrap;
  }
  .seg {
    display: inline-flex;
    padding: 3px;
    gap: 2px;
    background: var(--surface);
    border-radius: 12px;
    box-shadow: var(--shadow-float);
  }
  .seg button {
    appearance: none;
    border: 0;
    min-width: 64px;
    height: 36px;
    padding: 0 14px;
    border-radius: 10px;
    background: transparent;
    color: var(--text-2);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background var(--dur) var(--ease), color var(--dur) var(--ease),

  }
  .seg button[aria-selected="true"] {
    background: var(--text);
    color: var(--bg);
    box-shadow: var(--shadow-float);
  }
  .seg button:active { transform: scale(0.96); }

  .ghost {
    appearance: none;
    border: 0;
    height: 42px;
    padding: 0 16px;
    border-radius: var(--radius-pill);
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: var(--shadow-float);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: transform var(--dur) var(--ease), background var(--dur) var(--ease);
  }
  .ghost:active { transform: scale(0.97); background: var(--surface-2); }
  .ghost svg { width: 16px; height: 16px; }

  button:focus-visible,
  [role="button"]:focus-visible {
    outline: 2px solid var(--tint);
    outline-offset: 2px;
  }

  /* Widget cards */
  .stage-label {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin: 0 2px var(--space-2);
    font-size: 11px;
    font-weight: 650;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-3);

  .card {
    background: var(--surface);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-card);
    overflow: hidden;
    transition: background var(--dur) var(--ease);
  }
  .card.hidden { display: none; }

  .status-row {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    min-height: var(--tap);
    padding: 10px 12px 10px 14px;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    transition: background var(--dur) var(--ease);

  .status-row:active { background: var(--surface-press); }

  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--off);
    flex-shrink: 0;
    transition: background var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
  }
  .dot.on {
    background: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-soft);
  }

  .status-text {
    flex: 1;
    min-width: 0;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .speed {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-2);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .power {
    width: var(--tap);
    height: var(--tap);
    border: 0;
    border-radius: 50%;
    background: var(--off-soft);
    color: var(--off);
    display: grid;
    place-items: center;
    cursor: pointer;
    flex-shrink: 0;

  .power:active { transform: scale(0.94); }
  .power.on {
    background: var(--accent-soft);
    color: var(--accent);

  .power svg { width: 20px; height: 20px; }

  .chart-wrap {
    height: 72px;

    border-radius: var(--radius-row);

    position: relative;
  }
  .chart-wrap canvas {
    width: 100%;
    height: 100%;
    display: block;
  }
  .chart-legend {
    position: absolute;
    top: 8px;
    right: 10px;
    display: flex;
    gap: 10px;
    font-size: 10px;
    font-weight: 650;
    color: var(--text-3);
    letter-spacing: 0.02em;
    pointer-events: none;
  }
  .chart-legend span {
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .chart-legend i {
    width: 8px;
    height: 3px;
    border-radius: 2px;
    display: inline-block;
  }

  .divider {
    height: 1px;
    background: var(--divider);
    margin: 0 14px;
  }

  .meta {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    min-height: var(--tap);
    padding: 0 14px;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    transition: background var(--dur) var(--ease);
  }
  .meta:active { background: var(--surface-press); }
  .meta .k {
    width: 44px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-2);
  }
  .meta .v {
    flex: 1;
    text-align: right;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.01em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .meta .chev {
    color: var(--text-3);
    font-size: 18px;
    line-height: 1;
    width: 18px;
    text-align: center;
    flex-shrink: 0;
  }

  /* Footer hint */
  .hint {
    margin-top: var(--space-5);
    padding: 14px 16px;
    border-radius: 18px;
    background: var(--surface);
    box-shadow: var(--shadow-float);
    font-size: 12px;
    line-height: 1.6;
    color: var(--text-2);
  }
  .hint b {
    color: var(--text);
    font-weight: 650;
  }
  .hint .row {
    display: flex;
    gap: 8px;
    align-items: flex-start;
  }
  .hint .row + .row { margin-top: 8px; }
  .hint .tag {
    flex-shrink: 0;
    margin-top: 1px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--tint);
  }

  /* Toast */
  .toast {
    position: fixed;
    left: 50%;
    bottom: max(24px, env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(12px);
    max-width: min(88vw, 360px);
    padding: 12px 18px;
    border-radius: var(--radius-pill);
    background: rgba(20, 20, 22, 0.92);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 200ms var(--ease), transform 200ms var(--ease);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    z-index: 50;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    border: 0;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }

  @media (max-width: 360px) {
    .speed { display: none; }
    .brand h1 { font-size: 20px; }
  }
</style>

<body>
<p data-aigc-mark="1" style="margin:0 0 8px;font-size:10px;line-height:1.3;color:#6b6560;font-weight:400;">AI生成</p>

  <div class="app">
    <header class="top">
      <div class="brand">

      </div>
      <div class="badge" id="romTag"><i></i><span>标准路径</span></div>
    </header>

    <div class="toolbar">
      <div class="seg" role="tablist" aria-label="组件尺寸">

        <button role="tab" data-size="4x2" aria-selected="false">4×2</button>
      </div>
      <button class="ghost" id="themeBtn" aria-label="切换深浅色">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">

    <section class="card hidden" id="card4" role="group" aria-label="4×2 小部件" style="margin-top:12px">

        <div class="dot on" id="dot4" aria-hidden="true"></div>

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">

        <div class="k">模式</div>
        <div class="v" id="mode4">规则</div>
        <div class="chev" aria-hidden="true">›</div>
      </div>
      <div class="divider"></div>
      <div class="meta" role="button" tabindex="0" id="nodeRow4">

        <div class="tag">实现</div>
        <div><b>HyperOS/MIUI</b> 优先走小米 launcher 刷新通道；检测失败或未生效时回退标准 AppWidgetManager。</div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="sr-only" id="live" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  const modes = [
    { id: "rule", zh: "规则" },
    { id: "global", zh: "全局" },
    { id: "direct", zh: "直连" },
  ];
  const nodes = ["香港 01", "日本 02", "新加坡 01", "美国 03", "自动"];

  const state = {
    running: true,
    modeIndex: 0,
    nodeIndex: 0,
    size: "2x2",
    theme: "light",
  };

  const $ = (id) => document.getElementById(id);
  const toastEl = $("toast");
  const liveEl = $("live");
  let toastTimer = 0;

  function announce(msg) {
    liveEl.textContent = msg;
  }

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    announce(msg);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1700);
    if (navigator.vibrate) {
      try { navigator.vibrate(10); } catch (_) {}
    }
  }

  function formatSpeed() {
    if (!state.running) return "↓ 0 B/s · ↑ 0 B/s";
    const t = Date.now() / 1000;
    const down = 0.55 + Math.abs(Math.sin(t / 2.1)) * 2.35;
    const up = 0.12 + Math.abs(Math.cos(t / 1.7)) * 0.68;
    return `↓ ${down.toFixed(1)} MB/s · ↑ ${Math.round(up * 1000)} KB/s`;
  }

  function paintStatus() {
    const status = state.running ? "运行中" : "已停止";
    const speed = formatSpeed();
    ["2", "4"].forEach((k) => {
      const dot = $("dot" + k);
      const st = $("status" + k);
      const sp = $("speed" + k);
      const pw = $("power" + k);
      if (!dot) return;
      dot.classList.toggle("on", state.running);
      st.textContent = status;
      if (sp) sp.textContent = speed;
      pw.classList.toggle("on", state.running);
      pw.setAttribute("aria-pressed", state.running ? "true" : "false");
    });
  }

  function paintMeta() {
    const mode = modes[state.modeIndex].zh;
    const node = nodes[state.nodeIndex];
    ["2", "4"].forEach((k) => {
      const m = $("mode" + k);
      const n = $("node" + k);
      if (m) m.textContent = mode;
      if (n) n.textContent = node;
    });
  }

  const history = Array.from({ length: 56 }, () => ({
    up: 0.18 + Math.random() * 0.55,
    down: 0.7 + Math.random() * 1.9,
  }));
  const canvas = $("chart");
  const ctx = canvas.getContext("2d");

  function cssVar(name) {
    return getComputedStyle(document.body).getPropertyValue(name).trim();
  }

  function drawChart() {
    const w = canvas.width;
    const h = canvas.height;
    ctx.clearRect(0, 0, w, h);

    const max = Math.max(1.2, ...history.map((p) => p.up + p.down));
    const pad = 10;
    const step = (w - pad * 2) / (history.length - 1);

    function stroke(key, color, width) {
      ctx.beginPath();
      history.forEach((p, i) => {
        const x = pad + i * step;
        const y = h - 14 - (p[key] / max) * (h - 36);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.lineJoin = "round";
      ctx.lineCap = "round";
      ctx.stroke();
    }

    stroke("down", cssVar("--chart-down") || "#22c55e", 3.5);
    stroke("up", cssVar("--chart-up") || "#6366f1", 3);
  }

  function tickChart() {
    history.push({
      up: 0.12 + Math.random() * (state.running ? 0.75 : 0.04),
      down: 0.45 + Math.random() * (state.running ? 2.3 : 0.04),
    });
    if (history.length > 56) history.shift();
    if (state.size === "4x2") drawChart();
    paintStatus();
  }

  function togglePower() {
    state.running = !state.running;
    paintStatus();
    toast(state.running ? "已启动 VPN · QuickAction 通道" : "已停止 VPN");
  }

  function cycleMode() {
    state.modeIndex = (state.modeIndex + 1) % modes.length;
    paintMeta();
    toast("模式 · " + modes[state.modeIndex].zh);
  }

  function cycleNode() {
    state.nodeIndex = (state.nodeIndex + 1) % nodes.length;
    paintMeta();
    toast("节点 · " + nodes[state.nodeIndex]);
  }

  function bindAction(el, fn) {
    if (!el) return;
    el.addEventListener("click", (e) => {
      if (e.target.closest("button.power") && el.classList.contains("status-row")) {
        return;
      }
      fn();
    });
    el.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        fn();
      }
    });
  }

  ["2", "4"].forEach((k) => {
    const toggle = $("toggleRow" + k);
    const power = $("power" + k);
    if (power) {
      power.addEventListener("click", (e) => {
        e.stopPropagation();
        togglePower();
      });
    }
    bindAction(toggle, togglePower);
    bindAction($("modeRow" + k), cycleMode);
    bindAction($("nodeRow" + k), cycleNode);
  });

  const sizeSeg = document.querySelector(".seg");
  sizeSeg.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-size]");
    if (!btn) return;
    state.size = btn.dataset.size;
    sizeSeg.querySelectorAll("button").forEach((b) => {
      b.setAttribute("aria-selected", b === btn ? "true" : "false");
    });
    $("card2").classList.toggle("hidden", state.size !== "2x2");
    $("card4").classList.toggle("hidden", state.size !== "4x2");
    $("sizeLabel").textContent = state.size === "4x2" ? "4 × 2" : "2 × 2";
    if (state.size === "4x2") drawChart();
  });

  $("themeBtn").addEventListener("click", () => {
    state.theme = state.theme === "light" ? "dark" : "light";
    document.body.dataset.theme = state.theme;
    document.querySelector("#themeBtn span").textContent =
      state.theme === "light" ? "深色" : "浅色";
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", state.theme === "dark" ? "#0b0b0d" : "#f0f0f3");
    drawChart();
    toast(state.theme === "dark" ? "深色卡片" : "浅色卡片");
  });

  const isHyper =
    /Xiaomi|Redmi|MIUI|HyperOS/i.test(navigator.userAgent || "") ||
    (navigator.userAgentData && navigator.userAgentData.platform === "mobile");
  $("romTag").querySelector("span").textContent = isHyper
    ? "小米通道优先"
    : "标准 AppWidget";
  $("romTag").style.background = isHyper
    ? "var(--accent-soft)"
    : "var(--off-soft)";
  $("romTag").style.color = isHyper ? "var(--accent)" : "var(--text-2)";

  paintStatus();
  paintMeta();
  drawChart();
  setInterval(tickChart, 1200);
})();
</script>
</body>
</html>
